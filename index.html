<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CFB Conversion Carbon Tool</title>
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1f22;--muted:#5d636b;--line:#e3e0d8;--soft:#efede7;
  --accent:#1f6f5c;--accent-soft:#e2f0ea;--warn:#8f5400;--warn-soft:#fbefd9;--bad:#b3261e;--bad-soft:#fbe5e3;
  --blue-soft:#e6eef8;--blue:#245a9a;--grid:#ebe8e1;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161719;--card:#1f2124;--ink:#ecebe7;--muted:#a6abb2;--line:#34373c;--soft:#2a2d31;
  --accent:#6fc7ad;--accent-soft:#1d3a33;--warn:#f0b65c;--warn-soft:#3a2f1c;--bad:#f2948d;--bad-soft:#3b2220;
  --blue-soft:#1e2a3a;--blue:#8db6ee;--grid:#2c2f33;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}}
:root[data-theme="dark"]{
  --bg:#161719;--card:#1f2124;--ink:#ecebe7;--muted:#a6abb2;--line:#34373c;--soft:#2a2d31;
  --accent:#6fc7ad;--accent-soft:#1d3a33;--warn:#f0b65c;--warn-soft:#3a2f1c;--bad:#f2948d;--bad-soft:#3b2220;
  --blue-soft:#1e2a3a;--blue:#8db6ee;--grid:#2c2f33;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:8px 12px;display:flex;align-items:center;border:1px solid var(--line)}
.logo img{height:34px;display:block}
.by{font-size:.86rem;color:var(--muted);line-height:1.35}
.by b{color:var(--ink);font-size:1rem}
h1{font-size:1.6rem;line-height:1.2;margin:18px 0 0}
.sub{color:var(--muted);margin:6px 0 0;max-width:820px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.seg-btn{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg-btn button{border:none;border-radius:0;padding:5px 11px;background:var(--card)}
.seg-btn button.on{background:var(--ink);color:var(--card)}
h2{font-size:1.15rem;margin:34px 0 4px}
.h2sub{color:var(--muted);font-size:.9rem;margin:0 0 12px;max-width:820px}
h3{font-size:.98rem;margin:0 0 4px}
.csub{color:var(--muted);font-size:.84rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.boilers{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.boiler .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
.boiler .row label{color:var(--muted);font-size:.88rem}
.boiler input[type=text]{font:inherit;font-weight:600;border:none;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);width:100%;padding:2px 0}
.boiler .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
input[type=number]{font:inherit;width:96px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.ref{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:99px;white-space:nowrap}
.x{border:none;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.heroes{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.hero .big{font-size:2.1rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .unit{color:var(--muted);font-size:.84rem}
.hero .line{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .line span:first-child{color:var(--muted)}
.hero .top3{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.delta{display:inline-block;margin-top:8px;font-weight:700;font-size:.95rem;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.delta.up{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);margin:4px 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ln{display:inline-block;width:16px;height:2px;margin-right:6px;vertical-align:3px}
.barrow{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:10px;align-items:center;margin:10px 0}
.barrow .name{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:30px}
.track.thin{height:22px}
.seg{position:absolute;top:0;height:100%;border-right:2px solid var(--card);cursor:pointer;transition:filter .15s}
.seg:hover,.seg.sel{filter:brightness(1.12) saturate(1.1)}
.seg.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.seg.first{border-radius:4px 0 0 4px}
.seg.last{border-radius:0 4px 4px 0;border-right:none}
.seg.only{border-radius:4px;border-right:none}
.tot{position:absolute;top:50%;transform:translateY(-50%);font-size:.84rem;font-weight:600;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:10px;font-size:.76rem;color:var(--muted)}
.axis .ticks{position:relative;height:18px;border-top:1px solid var(--line)}
.axis .ticks span{position:absolute;transform:translateX(-50%);top:2px}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:.82rem;padding:6px 9px;border-radius:8px;z-index:10;display:none;max-width:280px;line-height:1.35}
.panel{border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));background:var(--card);border-radius:12px;padding:14px 16px;margin-top:12px}
.panel h4{margin:0 0 2px;font-size:1rem}
.panel .meta{color:var(--muted);font-size:.84rem;margin-bottom:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .d{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.item .d b{color:var(--ink);font-weight:600}
.item .mini{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.item .mini span{display:block;height:100%;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pareto .row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;margin:5px 0;cursor:pointer}
.pareto .row:hover .nm{text-decoration:underline}
.pareto .nm{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pareto .bar{height:16px;border-radius:0 4px 4px 0}
.pareto .pc{font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fall .row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;margin:3px 0}
.fall .trk{position:relative;height:18px}
.fall .b{position:absolute;top:0;height:100%;border-radius:3px}
.fall .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.fall .vv{font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.fall .row.endrow .nm{font-weight:700}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
svg .gl{stroke:var(--grid);stroke-width:1}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:none}
tr.sum td{font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.t{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.t-sabit{background:var(--soft);color:var(--muted)}
.t-girdi{background:var(--blue-soft);color:var(--blue)}
.t-secenek{background:var(--accent-soft);color:var(--accent)}
.t-kaydirici{background:#efe7fb;color:#5b3fb0}
:root[data-theme="dark"] .t-kaydirici{background:#2a2340;color:#b9a8f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-kaydirici{background:#2a2340;color:#b9a8f2}}
.t-turetilmis{background:var(--warn-soft);color:var(--warn)}
.onay{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.grp summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.grp .wrap{border:none;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.ptable{min-width:760px}
.ptable td:nth-child(2){width:150px;white-space:nowrap}
.ptable .src{color:var(--muted);font-size:.8rem;min-width:220px}
.ptable input[type=range]{width:120px;vertical-align:middle}
.rv{font-variant-numeric:tabular-nums;font-weight:600;margin-left:6px}
.ok{color:var(--accent);font-weight:700}
.warnc{color:var(--warn);font-weight:700}
.note{background:var(--warn-soft);border-radius:12px;padding:12px 16px;font-size:.9rem}
.note ul{margin:6px 0 0;padding-left:20px}
.types{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.84rem;color:var(--muted);align-items:center}
.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.focusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;font-size:.9rem}
.steam{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.steam input[type=range]{width:min(420px,100%)}
.steam .rv{font-size:1.1rem}
.save{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.save .big{font-size:1.7rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.save .lbl{color:var(--muted);font-size:.84rem}
.good{color:var(--accent)}
.badv{color:var(--bad)}
footer{color:var(--muted);font-size:.82rem;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
#rapor{display:none}
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#1d1f22;--muted:#555b63;--line:#dcd9d1;--soft:#f1efea;--accent:#1f6f5c;--accent-soft:#e2f0ea;--warn:#8f5400;--warn-soft:#fbefd9;--bad:#b3261e;--bad-soft:#fbe5e3;--grid:#e6e3dc;
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
  @page{size:A4;margin:14mm 13mm}
  body{background:#fff;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main,.tip{display:none!important}
  #rapor{display:block}
  #rapor h1{font-size:18pt;margin:10px 0 2px}
  #rapor h2{font-size:12.5pt;margin:16px 0 6px;break-after:avoid}
  #rapor .blok{break-inside:avoid;margin-bottom:8px}
  #rapor .card{border:1px solid var(--line);padding:10px 12px;border-radius:8px}
  #rapor table{font-size:8.6pt}
  #rapor th,#rapor td{padding:4px 6px}
  #rapor .wrap{overflow:visible;border-radius:6px}
  #rapor .ptable{min-width:0}
  #rapor .heroes{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  #rapor .hero .big{font-size:18pt}
  #rapor .save{grid-template-columns:repeat(4,1fr)}
  #rapor .save .big{font-size:13pt}
  #rapor .cols2{grid-template-columns:1fr 1fr}
  #rapor .kapak{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px}
  #rapor .kapak img{height:30px}
  #rapor .meta2{color:var(--muted);font-size:9pt}
  #rapor .sayfa{break-before:page}
  #rapor .x{display:none}
}
@media (max-width:560px){h1{font-size:1.3rem}.hero .big{font-size:1.7rem}.barrow,.axis{grid-template-columns:86px 1fr}
  .pareto .row,.fall .row{grid-template-columns:100px 1fr 56px}.cols2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="by"><span data-i="hazirlayan"></span><br><b>Emine Edis</b></div>
    </div>
    <div class="toolbar">
      <button class="primary" id="pdf" data-i="pdf"></button>
      <button id="dil">EN</button>
      <button id="sifirla" data-i="sifirla"></button>
    </div>
  </header>
  <h1 data-i="baslik"></h1>
  <p class="sub" data-i="altbaslik"></p>

  <h2 data-i="h_kazanlar"></h2>
  <div class="grid boilers" id="kazanlar"></div>
  <p style="margin:10px 0 0"><button class="primary" id="ekle" data-i="ekle"></button></p>

  <h2 data-i="h_sonuc"></h2>
  <div class="grid heroes" id="heroes"></div>

  <h2 data-i="h_nereden"></h2>
  <p class="h2sub" data-i="s_nereden"></p>
  <div class="card">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center">
      <h3 data-i="h_ayakizi"></h3>
      <div class="seg-btn" id="gorunum"><button data-v="kaynak"></button><button data-v="asama"></button></div>
    </div>
    <div class="legend" id="lg-karbon"></div>
    <div id="ch-karbon"></div>
    <p class="hint" data-i="ipucu"></p>
    <div id="detay"></div>
  </div>

  <div class="focusbar" style="margin-top:22px"><span data-i="odak"></span><select id="odak"></select></div>
  <div class="grid cols2">
    <div class="card">
      <h3 data-i="h_pareto"></h3>
      <p class="csub" data-i="s_pareto"></p>
      <div class="pareto" id="ch-pareto"></div>
    </div>
    <div class="card">
      <h3 id="h-kopru"></h3>
      <p class="csub" data-i="s_kopru"></p>
      <div class="fall" id="ch-kopru"></div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3 data-i="h_tornado"></h3>
    <p class="csub" data-i="s_tornado"></p>
    <div class="legend" id="lg-tornado"></div>
    <div class="fall" id="ch-tornado"></div>
  </div>

  <h2 data-i="h_para"></h2>
  <p class="h2sub" data-i="s_para"></p>
  <div class="card">
    <div class="steam">
      <label for="buhar" data-i="buharsec"></label>
      <input type="range" id="buhar" min="100" max="2000" step="5">
      <span><span class="rv" id="buhar-v"></span> GWh/a</span>
      <span class="csub" style="margin:0" id="buhar-not"></span>
    </div>
    <div class="grid save" id="tasarruf"></div>
    <div class="grid cols2" style="margin-top:14px">
      <div>
        <h3 data-i="h_yilmaliyet"></h3>
        <div class="legend" id="lg-yil"></div>
        <div id="ch-yil"></div>
      </div>
      <div>
        <h3 data-i="h_yilkarbon"></h3>
        <div class="legend" id="lg-yilk"></div>
        <div id="ch-yilk"></div>
      </div>
    </div>
  </div>
  <div class="grid cols2" style="margin-top:12px">
    <div class="card">
      <h3 data-i="h_maliyet"></h3>
      <div class="legend" id="lg-maliyet"></div>
      <div id="ch-maliyet"></div>
    </div>
    <div class="card">
      <h3 data-i="h_ets"></h3>
      <p class="csub" id="ets-not"></p>
      <div class="legend" id="lg-ets"></div>
      <div id="ch-ets"></div>
    </div>
  </div>

  <h2 data-i="h_yillik"></h2>
  <div class="wrap"><table id="yillik"></table></div>

  <h2 data-i="h_kalemler"></h2>
  <p class="h2sub" data-i="s_kalemler"></p>
  <div class="wrap"><table id="kalemler"></table></div>
  <div id="detay2"></div>

  <h2 data-i="h_kontrol"></h2>
  <div class="wrap"><table id="kontrol"></table></div>

  <h2 data-i="h_param"></h2>
  <div class="types" id="turler"></div>
  <div id="params"></div>

  <h2 data-i="h_eksik"></h2>
  <div class="note" id="eksik"></div>

  <footer><span data-i="dipnot"></span></footer>
</main>
<div class="tip" id="tip"></div>
<section id="rapor"></section>

<script src="model.js"></script>
<script>

const { VARSAYILAN, KAZANLAR, ULKELER, hesapla } = Model;

    sifirla: "Varsayılana dön", ekle: "+ Kazan ekle",

// ---------------------------------------------------------------- durum
const kopya = o => JSON.parse(JSON.stringify(o));
let dil = "en", P = kopya(VARSAYILAN), KZ = kopya(KAZANLAR), gorunum = "kaynak", odak = 1, buhar = 795, secili = null;
try {
  const s = JSON.parse(localStorage.getItem("donusum-araci") || "null");
  if (s) { dil = s.dil || dil; P = Object.assign(kopya(VARSAYILAN), s.P || {}); KZ = s.KZ || KZ; buhar = s.buhar || buhar; gorunum = s.gorunum || gorunum; }
} catch (e) {}
const kaydet = () => { try { localStorage.setItem("donusum-araci", JSON.stringify({ dil, P, KZ, buhar, gorunum })); } catch (e) {} };
const t = k => T[dil][k];
const YEREL = { tr: "tr-TR", en: "en-GB", fi: "fi-FI" };
const fmt = (v, d = 1) => (v ?? 0).toLocaleString(YEREL[dil], { minimumFractionDigits: d, maximumFractionDigits: d });
const al = k => k.includes(".") ? P[k.split(".")[0]][k.split(".")[1]] : P[k];
const ver = (k, v) => { if (k.includes(".")) { const [a, b] = k.split("."); P[a][b] = v; } else P[k] = v; };
const kAd = k => KALEM[k][dil][0];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

// ---------------------------------------------------------------- ipucu kutusu
const tip = document.getElementById("tip");
function ipucuBagla(root) {
  root.querySelectorAll("[data-tip]").forEach(s => {
    s.addEventListener("mousemove", e => { tip.innerHTML = s.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + "px"; tip.style.top = e.clientY + 14 + "px"; });
    s.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}
function ticks(max) {
  const step = [0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => max / s <= 5) || 2000;
  const ust = Math.ceil(max / step) * step;
  const a = []; for (let v = 0; v <= ust + 1e-9; v += step) a.push(+v.toFixed(6)); return a;
}

// ---------------------------------------------------------------- kazan kartları
function kazanKartlari() {
  const el = document.getElementById("kazanlar");
  el.innerHTML = "";
  KZ.forEach((k, i) => {
    const d = document.createElement("div");
    d.className = "card boiler";
    d.innerHTML = `
      <div class="row"><span class="dot" style="background:var(${KAZAN_RENK[i % 8]})"></span><input type="text" value="${esc(k.ad)}" data-f="ad" aria-label="${t("ad")}">
        ${i === 0 ? `<span class="ref">${t("referans")}</span>` : `<button class="x" title="${t("sil")}" data-sil>×</button>`}</div>
      <div class="row"><label>${t("komur")}</label><span class="rv">%${k.share_coal}</span></div>
      <input type="range" min="0" max="100" step="5" value="${k.share_coal}" data-f="share_coal" aria-label="${t("komur")}">
      <div class="row"><label>${t("verim")}</label><input type="number" step="0.005" value="${k.eta}" data-f="eta"></div>
      <div class="row"><label>${t("kap")}, MW</label><input type="number" step="0.1" value="${+k.kap.toFixed(1)}" data-f="kap"></div>
      <div class="row"><label>${t("saat")}, h/a</label><input type="number" step="100" value="${k.saat}" data-f="saat"></div>
      <div class="row"><label>${t("kirec")}</label><input type="checkbox" ${k.kirectasi ? "checked" : ""} data-f="kirectasi"></div>`;
    d.querySelectorAll("[data-f]").forEach(inp => {
      inp.addEventListener("input", () => {
        const f = inp.dataset.f;
        k[f] = f === "ad" ? inp.value : f === "kirectasi" ? inp.checked : +inp.value;
        if (f === "share_coal") inp.previousElementSibling.querySelector(".rv").textContent = "%" + k.share_coal;
        if (f === "ad") odakListesi();
        guncelle();
      });
    });
    const sil = d.querySelector("[data-sil]");
    if (sil) sil.addEventListener("click", () => { KZ.splice(i, 1); if (odak >= KZ.length) odak = KZ.length - 1; secili = null; kazanKartlari(); odakListesi(); guncelle(); });
    el.appendChild(d);
  });
}
function odakListesi() {
  const s = document.getElementById("odak");
  s.innerHTML = KZ.map((k, i) => `<option value="${i}" ${i === odak ? "selected" : ""}>${esc(k.ad)}</option>`).join("");
}

// ---------------------------------------------------------------- parametre tabloları
function parametreler() {
  document.getElementById("turler").innerHTML = Object.entries(t("turler")).map(([k, v]) => `<span class="t t-${k}">${v}</span>`).join("") + `<span class="onay">${t("onay")}</span>`;
  const el = document.getElementById("params");
  el.innerHTML = "";
  GRUPLAR.forEach((g, gi) => {
    const det = document.createElement("details");
    det.className = "grp";
    if (gi < 2) det.open = true;
    const satirlar = g.p.map(p => {
      const ad = p.tr.startsWith("__") ? t(p.tr.slice(2)) : p[dil];
      let kontrol = "";
      if (p.tur === "secenek") {
        const etiket = v => v === true ? t("evet") : v === false ? t("hayir") : ULKELER[v] ? ULKELER[v].ad[dil] : t(v);
        kontrol = `<select data-k="${p.k}">${p.sec.map(v => `<option value="${v}" ${String(al(p.k)) === String(v) ? "selected" : ""}>${etiket(v)}</option>`).join("")}</select>`;
      } else if (p.tur === "kaydirici") {
        kontrol = `<input type="range" min="${p.min}" max="${p.max}" step="${p.st}" value="${al(p.k)}" data-k="${p.k}" aria-label="${ad}"><span class="rv" data-rv="${p.k}">${al(p.k)}</span>`;
      } else if (p.tur === "turetilmis") {
        kontrol = `<span class="rv" data-der="${p.k}"></span>`;
      } else if (p.tur === "sabit") {
        kontrol = `<span class="rv">${al(p.k)}</span>`;
      } else {
        kontrol = `<input type="number" step="${p.st}" value="${+(+al(p.k)).toFixed(4)}" data-k="${p.k}" aria-label="${ad}">`;
      }
      return `<tr><td>${ad} ${p.onay ? `<span class="onay">${t("onay")}</span>` : ""}</td><td>${kontrol}</td><td>${p.u || ""}</td>
        <td><span class="t t-${p.tur}">${t("turler")[p.tur]}</span></td><td class="src">${p.kaynak}</td></tr>`;
    }).join("");
    det.innerHTML = `<summary>${g[dil]}</summary><div class="wrap"><table class="ptable">
      <tr><th>${t("kalem")}</th><th>${t("deger")}</th><th>${t("birimk")}</th><th>${t("tur")}</th><th>${t("kaynak")}</th></tr>${satirlar}</table></div>`;
    el.appendChild(det);
  });
  el.querySelectorAll("[data-k]").forEach(inp => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.k;
      let v = inp.value;
      if (v === "true" || v === "false") v = v === "true";
      else if (k === "ulke") { Object.assign(P, ULKELER[v]); P.ulke = v; parametreler(); guncelle(); return; }
      else if (!["n2o_mod", "malz_arac"].includes(k)) v = +v;
      ver(k, v);
      const rv = el.querySelector(`[data-rv="${k}"]`);
      if (rv) rv.textContent = v;
      guncelle();
    });
  });
}

// ---------------------------------------------------------------- yığılmış çubuk
function cubuk(hedef, lgHedef, sonuclar, gruplar, kaynak, sozluk, birim, opt = {}) {
  document.getElementById(lgHedef).innerHTML = gruplar.map(([k, , c]) => `<span><i style="background:var(${c})"></i>${t(sozluk)[k]}</span>`).join("");
  const carp = opt.carp || (() => 1);
  const toplamlar = sonuclar.map((K, i) => gruplar.reduce((s, [, ks]) => s + ks.reduce((a, x) => a + K[kaynak][x], 0), 0) * carp(K, i));
  const tk = ticks(Math.max(...toplamlar, 1e-6) * 1.2);
  const olcek = tk[tk.length - 1];
  const d = opt.d ?? 1;
  let h = "";
  sonuclar.forEach((K, i) => {
    let x = 0, segs = "";
    const dolu = gruplar.map(([k, ks, c]) => [k, ks.reduce((a, y) => a + K[kaynak][y], 0) * carp(K, i), c, ks]).filter(s => s[1] > 1e-9);
    dolu.forEach(([k, v, c, ks], j) => {
      const w = v / olcek * 100;
      const cls = dolu.length === 1 ? "only" : j === 0 ? "first" : j === dolu.length - 1 ? "last" : "";
      const sel = secili && opt.tikla && secili.i === i && secili.g === k ? " sel" : "";
      segs += `<div class="seg ${cls}${sel}" style="left:${x}%;width:${w}%;background:var(${c})" data-i="${i}" data-g="${k}" data-ks="${ks.join(",")}" data-c="${c}"
        data-tip="${esc(K.ad)}<br><b>${t(sozluk)[k]}</b>: ${fmt(v, d + 1)} ${birim} (%${fmt(v / toplamlar[i] * 100, 0)})"></div>`;
      x += w;
    });
    h += `<div class="barrow"><div class="name" title="${esc(K.ad)}">${esc(K.ad)}</div><div class="track">${segs}<span class="tot" style="left:${x}%">${fmt(toplamlar[i], d)}</span></div></div>`;
  });
  h += `<div class="axis"><div></div><div class="ticks">${tk.map(v => `<span style="left:${v / olcek * 100}%">${fmt(v, olcek < 5 ? 1 : 0)}</span>`).join("")}</div></div>`;
  const el = document.getElementById(hedef);
  el.innerHTML = h;
  ipucuBagla(el);
  if (opt.tikla) el.querySelectorAll(".seg").forEach(s => s.addEventListener("click", () => opt.tikla(+s.dataset.i, s.dataset.g, s.dataset.ks.split(","), s.dataset.c)));
}

// ---------------------------------------------------------------- "nereden geliyor" paneli
function detayHtml(K, baslik, ks, renk) {
  const top = ks.reduce((a, k) => a + K.em[k], 0);
  const items = ks.filter(k => K.em[k] > 1e-9).sort((a, b) => K.em[b] - K.em[a]).map(k => {
    const m = KALEM[k], x = m[dil];
    const pay = K.em[k] / K.toplam * 100;
    return `<div class="item"><div><b>${x[0]}</b></div><div class="v">${fmt(K.em[k], 2)} <span class="csub">kg CO₂e</span></div>
      <div class="mini"><span style="width:${Math.min(pay, 100)}%;background:var(${RENK_KALEM[k]})"></span></div>
      <div class="d">%${fmt(pay, 1)} ${t("payi")} · <b>${t("asama")}:</b> ${t("a")[m.asama]}</div>
      <div class="d"><b>${t("nerede")}:</b> ${x[1]}</div>
      <div class="d"><b>${t("neden")}:</b> ${x[2]}</div>
      <div class="d"><b>${t("formul")}:</b> ${x[3]}</div>
      <div class="d"><b>${t("kaynak")}:</b> ${m.src}</div></div>`;
  }).join("");
  const bos = ks.every(k => K.em[k] <= 1e-9);
  return `<div class="panel" style="--c:var(${renk})">
    <div style="display:flex;justify-content:space-between;gap:10px"><div><h4>${baslik}</h4>
    <div class="meta">${esc(K.ad)} · ${fmt(top, 2)} kg CO₂e / MWh · %${fmt(top / K.toplam * 100, 1)} ${t("payi")}</div></div>
    <button class="x" data-kapat title="${t("kapat")}">×</button></div>
    ${bos ? `<div class="d csub">0</div>` : items}</div>`;
}
function detayAc(hedef, i, baslik, ks, renk) {
  const R = hesapla(P, KZ);
  const el = document.getElementById(hedef);
  el.innerHTML = detayHtml(R.kazanlar[i], baslik, ks, renk);

}

// ---------------------------------------------------------------- pareto
function pareto(K) {
  const ks = Object.keys(K.em).filter(k => K.em[k] > 1e-9).sort((a, b) => K.em[b] - K.em[a]);
  const enb = K.em[ks[0]] || 1;
  let bir = 0;
  const el = document.getElementById("ch-pareto");
  el.innerHTML = ks.map(k => {
    bir += K.em[k];
    return `<div class="row" data-k="${k}" data-tip="<b>${kAd(k)}</b>: ${fmt(K.em[k], 2)} kg CO₂e<br>${t("payi")}: %${fmt(K.em[k] / K.toplam * 100, 1)} · Σ %${fmt(bir / K.toplam * 100, 0)}">
      <div class="nm">${kAd(k)}</div>
      <div><div class="bar" style="width:${Math.max(K.em[k] / enb * 100, 0.8)}%;background:var(${RENK_KALEM[k]})"></div></div>
      <div class="pc">%${fmt(K.em[k] / K.toplam * 100, 1)}</div></div>`;
  }).join("");
  ipucuBagla(el);
  el.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => {
    const k = r.dataset.k;
    detayAc("detay", odak, kAd(k), [k], RENK_KALEM[k]);
    document.getElementById("detay").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }));
}

// ---------------------------------------------------------------- köprü (şelale)
function kopru(ref, K) {
  document.getElementById("h-kopru").textContent = `${t("h_kopru")}: ${ref.ad} → ${K.ad}`;
  const ks = Object.keys(K.em).map(k => [k, K.em[k] - ref.em[k]]).filter(([, d]) => Math.abs(d) > 0.05).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  let cur = ref.toplam;
  const adim = ks.map(([k, d]) => { const a = cur; cur += d; return [k, d, a, cur]; });
  const max = Math.max(ref.toplam, K.toplam, ...adim.map(s => Math.max(s[2], s[3])));
  const pct = v => v / max * 100;
  const row = (nm, a, b, c, val, cls = "") => `<div class="row ${cls}"><div class="nm" title="${esc(nm)}">${esc(nm)}</div><div class="trk">
    <div class="b" style="left:${pct(Math.min(a, b))}%;width:${Math.max(pct(Math.abs(b - a)), 0.4)}%;background:${c}"></div></div><div class="vv">${val}</div></div>`;
  let h = row(ref.ad, 0, ref.toplam, "var(--muted)", fmt(ref.toplam, 1), "endrow");
  adim.forEach(([k, d, a, b]) => {
    h += `<div data-tip="<b>${kAd(k)}</b>: ${d > 0 ? "+" : "−"}${fmt(Math.abs(d), 2)} kg CO₂e">` +
      row(kAd(k), a, b, d < 0 ? "var(--s3)" : "var(--s8)", (d > 0 ? "+" : "−") + fmt(Math.abs(d), 1)) + "</div>";
  });
  h += row(K.ad, 0, K.toplam, "var(--muted)", fmt(K.toplam, 1), "endrow");
  const el = document.getElementById("ch-kopru");
  el.innerHTML = h;
  ipucuBagla(el);
}

// ---------------------------------------------------------------- tornado
function tornado() {
  document.getElementById("lg-tornado").innerHTML = `<span><i style="background:var(--s1)"></i>${t("alt_uc")}</span><span><i style="background:var(--s2)"></i>${t("ust_uc")}</span>`;
  const taban = hesapla(P, KZ).kazanlar[odak].toplam;
  const satirlar = TOR.map(([key, tr, en, lo, hi]) => {
    let rl, rh;
    if (key === "eta") {
      const k1 = kopya(KZ), k2 = kopya(KZ);
      k1[odak].eta = Math.min(KZ[odak].eta + 0.017, 0.99); k2[odak].eta = KZ[odak].eta - 0.02;
      rl = hesapla(P, k1).kazanlar[odak].toplam; rh = hesapla(P, k2).kazanlar[odak].toplam;
    } else {
      const pl = kopya(P), ph = kopya(P); lo(pl); hi(ph);
      rl = hesapla(pl, KZ).kazanlar[odak].toplam; rh = hesapla(ph, KZ).kazanlar[odak].toplam;
    }
    return { ad: dil === "tr" ? tr : dil === "fi" ? (TOR_FI[key] || en) : en, a: Math.min(rl, rh), b: Math.max(rl, rh) };
  }).filter(s => s.b - s.a > 0.05).sort((x, y) => (y.b - y.a) - (x.b - x.a)).slice(0, 10);
  const lo = Math.min(...satirlar.map(s => s.a), taban), hi = Math.max(...satirlar.map(s => s.b), taban);
  const pad = (hi - lo) * 0.08 || 1;
  const L = lo - pad, H = hi + pad, pct = v => (v - L) / (H - L) * 100;
  const el = document.getElementById("ch-tornado");
  el.innerHTML = satirlar.map(s => `<div class="row" data-tip="<b>${s.ad}</b><br>${fmt(s.a, 1)} – ${fmt(s.b, 1)} kg CO₂e / MWh"><div class="nm">${s.ad}</div><div class="trk">
      <div class="b" style="left:${pct(s.a)}%;width:${pct(taban) - pct(s.a)}%;background:var(--s1);border-radius:3px 0 0 3px"></div>
      <div class="b" style="left:${pct(taban)}%;width:${pct(s.b) - pct(taban)}%;background:var(--s2);border-radius:0 3px 3px 0"></div>
      <div class="zero" style="left:${pct(taban)}%"></div></div>
      <div class="vv">±${fmt((s.b - s.a) / 2, 1)}</div></div>`).join("") +
    `<div class="row"><div></div><div class="csub" style="text-align:center;margin:4px 0 0">${t("toplam")}: ${fmt(taban, 1)} · ${fmt(L, 0)} – ${fmt(H, 0)} kg CO₂e / MWh</div><div></div></div>`;
  ipucuBagla(el);
}

// ---------------------------------------------------------------- ETS çizgi grafiği
function etsGrafik(S) {
  const xs = []; for (let e = 0; e <= 200; e += 10) xs.push(e);
  const seri = S.map((_, i) => xs.map(e => { const q = kopya(P); q.ets = e; return hesapla(q, KZ).kazanlar[i].cost_top; }));
  const ymax = ticks(Math.max(...seri.flat()) * 1.1), Y = ymax[ymax.length - 1];
  const W = 520, Hh = 240, l = 40, r = 12, tp = 12, b = 26;
  const px = e => l + e / 200 * (W - l - r), py = v => tp + (1 - v / Y) * (Hh - tp - b);
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${t("h_ets")}">`;
  ymax.forEach(v => { svg += `<line class="gl" x1="${l}" x2="${W - r}" y1="${py(v)}" y2="${py(v)}"/><text x="${l - 6}" y="${py(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`; });
  [0, 50, 100, 150, 200].forEach(e => { svg += `<text x="${px(e)}" y="${Hh - 8}" text-anchor="middle">${e}</text>`; });
  svg += `<line x1="${px(P.ets)}" x2="${px(P.ets)}" y1="${tp}" y2="${Hh - b}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${px(P.ets) + 4}" y="${tp + 10}">${t("ets_bugun")} ${fmt(P.ets, 0)} €/t</text>`;
  seri.forEach((ys, i) => {
    svg += `<polyline fill="none" stroke="var(${KAZAN_RENK[i % 8]})" stroke-width="2" points="${ys.map((v, j) => `${px(xs[j])},${py(v)}`).join(" ")}"/>`;
    const q = kopya(P); const v = hesapla(q, KZ).kazanlar[i].cost_top;
    svg += `<circle cx="${px(P.ets)}" cy="${py(v)}" r="4.5" fill="var(${KAZAN_RENK[i % 8]})" stroke="var(--card)" stroke-width="2"><title>${esc(S[i].ad)}: ${fmt(v, 2)} €/MWh</title></circle>`;
  });
  svg += `<text x="${l}" y="${Hh - 8}" text-anchor="start" dx="-34">€/t</text></svg>`;
  document.getElementById("ch-ets").innerHTML = svg;
  document.getElementById("lg-ets").innerHTML = S.map((K, i) => `<span><span class="ln" style="background:var(${KAZAN_RENK[i % 8]})"></span>${esc(K.ad)}</span>`).join("");
  // odak kazanın referansla kesişimi: maliyet ETS'ye göre doğrusal
  const f = (i, e) => { const q = kopya(P); q.ets = e; return hesapla(q, KZ).kazanlar[i].cost_top; };
  let not = "";
  if (odak > 0) {
    const a0 = f(0, 0), a1 = f(0, 100), b0 = f(odak, 0), b1 = f(odak, 100);
    const s0 = (a1 - a0) / 100, s1 = (b1 - b0) / 100;
    const x = Math.abs(s0 - s1) < 1e-12 ? null : (b0 - a0) / (s0 - s1);
    if (b0 <= a0 && (b1 <= a1)) not = t("ets_hep");
    else if (x !== null && x >= 0 && x <= 200) not = t("ets_kesisim").replace("{x}", fmt(x, 0));
    else not = t("ets_hic");
    not = `${esc(KZ[odak].ad)}: ${not}`;
  }
  document.getElementById("ets-not").textContent = not;
}

// ---------------------------------------------------------------- yıllık karşılaştırma
function paraBolumu(S) {
  const sl = document.getElementById("buhar");
  sl.value = buhar;
  document.getElementById("buhar-v").textContent = fmt(buhar, 0);
  document.getElementById("buhar-not").textContent = t("buharnot");
  const G = buhar; // GWh = bin MWh
  const carpM = () => G / 1000;  // €/MWh × GWh / 1000 = M€
  cubuk("ch-yil", "lg-yil", S, GRUP_MALIYET, "cost", "c", "M€", { carp: carpM, d: 1 });
  cubuk("ch-yilk", "lg-yilk", S, GRUP_KARBON, "em", "g", "kt CO₂e", { carp: () => G / 1000, d: 1 });
  const ref = S[0], K = S[odak];
  if (!K || odak === 0) { document.getElementById("tasarruf").innerHTML = ""; return; }
  const dM = (K.cost_top - ref.cost_top) * G / 1000;          // M€/yıl
  const dGun = dM * 1e6 / 365;
  const dC = (K.toplam - ref.toplam) * G;                    // t/yıl
  const dE = (K.cost.ets - ref.cost.ets) * G / 1000;
  const kart = (v, lbl, iyi, birim) => `<div class="card"><div class="big ${iyi ? "good" : "badv"}">${v} <span style="font-size:1rem">${birim}</span></div><div class="lbl">${lbl}</div></div>`;
  const yon = (v, a, b) => v < 0 ? t(a) : t(b);
  document.getElementById("tasarruf").innerHTML =
    kart(fmt(Math.abs(dM), 1), `${esc(K.ad)}: ${t("tas_yil")} (${yon(dM, "ucuz", "pahali")})`, dM < 0, "M€") +
    kart(fmt(Math.abs(dGun) / 1000, 1), `${t("tas_gun")} (${yon(dM, "ucuz", "pahali")})`, dM < 0, "bin €") +
    kart(fmt(Math.abs(dC) / 1000, 1), `${t("tas_co2")} (${yon(dC, "az", "fazla")})`, dC < 0, "kt CO₂e") +
    kart(fmt(Math.abs(dE), 1), `${t("tas_ets")} (${yon(dE, "az", "fazla")})`, dE <= 0, "M€");
}

// ---------------------------------------------------------------- ana güncelleme
function guncelle() {
  const R = hesapla(P, KZ);
  const S = R.kazanlar;
  if (!S.length) return;
  if (odak >= S.length) odak = S.length - 1;
  const ref = S[0];
  const der = { _n2o_used: fmt(R.ortak.n2oc, 0), _LHV_ar: fmt(R.ortak.LHV_bio, 2), _truck: fmt(R.ortak.tr * P.truck_km, 2) };
  document.querySelectorAll("[data-der]").forEach(e => { e.textContent = der[e.dataset.der]; });
  // kahraman kartlar
  document.getElementById("heroes").innerHTML = S.map((K, i) => {
    const d = (K.toplam - ref.toplam) / ref.toplam * 100;
    const ilk3 = Object.keys(K.em).sort((a, b) => K.em[b] - K.em[a]).slice(0, 3).map(k => `${kAd(k)} %${fmt(K.em[k] / K.toplam * 100, 0)}`).join(" · ");
    return `<div class="card hero" style="border-top:4px solid var(${KAZAN_RENK[i % 8]})"><h3>${esc(K.ad)}</h3>
      <div class="big">${fmt(K.toplam, 1)}</div><div class="unit">${t("birim")}</div>
      ${i > 0 ? `<span class="delta ${d > 0 ? "up" : ""}">${d > 0 ? "+" : "−"}%${fmt(Math.abs(d), 1)} ${t("azalma")}</span>` : ""}
      <div class="line"><span>${t("fosilbaca")}</span><span>${fmt(K.fosil_baca, 1)}</span></div>
      <div class="line"><span>${t("biyojenik")}</span><span>${fmt(K.co2_bio, 1)}</span></div>
      <div class="line"><span>${t("maliyet")}</span><span>${fmt(K.cost_top, 2)} €/MWh</span></div>
      <div class="top3"><b>${t("enbuyuk")}:</b> ${ilk3}</div></div>`;
  }).join("");
  // nereden geliyor
  document.querySelectorAll("#gorunum button").forEach(b => { b.classList.toggle("on", b.dataset.v === gorunum); b.textContent = t(b.dataset.v + "_g"); });
  const gruplar = gorunum === "kaynak" ? GRUP_KARBON : GRUP_ASAMA;
  cubuk("ch-karbon", "lg-karbon", S, gruplar, "em", gorunum === "kaynak" ? "g" : "a", "kg CO₂e", {
    tikla: (i, g, ks, c) => {
      secili = { i, g };
      guncelle();
      detayAc("detay", i, t(gorunum === "kaynak" ? "g" : "a")[g], ks, c);
    },
  });
  // odak grafikleri
  pareto(S[odak]);
  kopru(ref, S[odak]);
  tornado();
  // para
  paraBolumu(S);
  cubuk("ch-maliyet", "lg-maliyet", S, GRUP_MALIYET, "cost", "c", "€/MWh", { d: 1 });
  etsGrafik(S);
  // tablolar
  const bas = `<tr><th></th>${S.map(K => `<th class="n">${esc(K.ad)}</th>`).join("")}</tr>`;
  const satir = (ad, f, d = 0) => `<tr><td>${ad}</td>${S.map(K => `<td class="n">${fmt(f(K), d)}</td>`).join("")}</tr>`;
  document.getElementById("yillik").innerHTML = bas +
    satir(t("buhar") + ", GWh", K => K.buhar_GWh) +
    satir(t("yilt") + ", t CO₂e", K => K.yil_t) +
    satir(t("yilm") + ", M€", K => K.yil_Meur, 2) +
    satir(t("komurt") + ", t", K => K.komur_t_yil) +
    satir(t("yongat") + ", t", K => K.yonga_t_yil);
  document.getElementById("kalemler").innerHTML = bas +
    Object.keys(KALEM).map(k => `<tr class="click" data-k="${k}"><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:var(${RENK_KALEM[k]})"></i>${kAd(k)}</td>${S.map(K => `<td class="n">${fmt(K.em[k], 2)}</td>`).join("")}</tr>`).join("") +
    `<tr class="sum"><td>${t("toplam")}</td>${S.map(K => `<td class="n">${fmt(K.toplam, 2)}</td>`).join("")}</tr>`;
  document.querySelectorAll("#kalemler tr.click").forEach(r => r.addEventListener("click", () => {
    const k = r.dataset.k;
    const i = S.reduce((bi, K, j) => K.em[k] > S[bi].em[k] ? j : bi, 0);
    detayAc("detay2", i, kAd(k), [k], RENK_KALEM[k]);
  }));
  document.getElementById("kontrol").innerHTML = bas +
    `<tr><td>${t("k_kutle")}</td>${S.map(K => `<td class="n ${Math.abs(K.m_diff) < 1e-6 ? "ok" : "warnc"}">${Math.abs(K.m_diff) < 1e-6 ? "0 ✓" : fmt(K.m_diff, 3)}</td>`).join("")}</tr>` +
    satir(t("k_o2"), K => K.O2_dry_check, 2) +
    satir(t("k_lam"), K => K.lambda_, 3) +
    `<tr><td>${t("k_so2")}<br><span style="color:var(--muted);font-size:.8rem">${t("k_so2not")}</span></td>${S.map(K => `<td class="n ${K.SO2_mg > 30 ? "warnc" : "ok"}">${fmt(K.SO2_mg, 0)}</td>`).join("")}</tr>`;
  kaydet();
}

// ---------------------------------------------------------------- PDF rapor (tarayıcının "PDF olarak kaydet" çıktısı)
function raporOlustur() {
  const R = hesapla(P, KZ), S = R.kazanlar;
  const html = id => document.getElementById(id).innerHTML;
  const kart = (baslik, govde) => `<div class="card blok"><h3>${baslik}</h3>${govde}</div>`;
  const tarih = new Date().toLocaleDateString(YEREL[dil], { day: "numeric", month: "long", year: "numeric" });
  const kazanTablo = `<div class="wrap blok"><table><tr><th>${t("ad")}</th><th class="n">${t("komur")}</th><th class="n">${t("verim")}</th><th class="n">${t("kap")}, MW</th><th class="n">${t("saat")}</th><th>${t("kirec")}</th></tr>
    ${KZ.map(k => `<tr><td>${esc(k.ad)}</td><td class="n">%${k.share_coal}</td><td class="n">${fmt(k.eta, 3)}</td><td class="n">${fmt(k.kap, 1)}</td><td class="n">${fmt(k.saat, 0)}</td><td>${k.kirectasi ? t("evet") : t("hayir")}</td></tr>`).join("")}</table></div>`;
  const varsayim = GRUPLAR.map(g => {
    const satir = g.p.filter(p => !["secenek", "turetilmis"].includes(p.tur) || p.k === "ulke" || p.k === "bio_sertifikali" || p.k === "n2o_mod" || p.k.startsWith("_")).map(p => {
      const ad = p.tr.startsWith("__") ? t(p.tr.slice(2)) : p[dil];
      let v;
      if (p.k === "_n2o_used") v = fmt(R.ortak.n2oc, 0);
      else if (p.k === "_LHV_ar") v = fmt(R.ortak.LHV_bio, 2);
      else if (p.k === "_truck") v = fmt(R.ortak.tr * P.truck_km, 2);
      else if (p.k === "ulke") v = ULKELER[P.ulke].ad[dil];
      else if (typeof al(p.k) === "boolean") v = al(p.k) ? t("evet") : t("hayir");
      else if (typeof al(p.k) === "string") v = t(al(p.k));
      else v = fmt(+al(p.k), +al(p.k) < 1 ? 3 : 2);
      const vs = p.k.startsWith("_") || typeof al(p.k) !== "number" ? null : (p.k.includes(".") ? VARSAYILAN[p.k.split(".")[0]][p.k.split(".")[1]] : VARSAYILAN[p.k]);
      const degisti = vs !== null && vs !== undefined && Math.abs(+al(p.k) - vs) > 1e-9;
      return `<tr><td>${ad}${p.onay ? ` <span class="onay">${t("onay")}</span>` : ""}${degisti ? ` <span class="onay" style="background:var(--warn-soft);color:var(--warn)">${t("r_degisen")}</span>` : ""}</td>
        <td class="n">${v}</td><td>${p.u || ""}</td><td><span class="t t-${p.tur}">${t("turler")[p.tur]}</span></td><td style="color:var(--muted)">${p.kaynak}</td></tr>`;
    }).join("");
    return `<tr><th colspan="5">${g[dil]}</th></tr>${satir}`;
  }).join("");
  const el = document.getElementById("rapor");
  el.innerHTML = `
    <div class="kapak"><b style="font-size:1.1rem">CFB conversion: carbon and cost</b><div class="meta2" style="text-align:right">${t("hazirlayan")}<br><b style="color:var(--ink)">Emine Edis</b> · ${t("r_tarih")}: ${tarih}</div></div>
    <h1>${t("r_baslik")}</h1>
    <p class="meta2">${t("altbaslik")}</p>
    <h2>${t("r_kapsam")}</h2><p>${t("r_kapsam_m")}</p>
    <h2>${t("r_kazan")}</h2>${kazanTablo}
    <h2>${t("r_sonuc")}</h2><div class="grid heroes blok">${html("heroes")}</div>
    <h2>${t("r_nereden")}</h2>
    ${kart(`${t("h_ayakizi")} · ${t(gorunum + "_g")}`, `<div class="legend">${html("lg-karbon")}</div>${html("ch-karbon")}`)}
    <div class="sayfa"></div>
    <h2>${t("r_odak")}: ${esc(KZ[odak].ad)}</h2>
    <div class="grid cols2">${kart(t("h_pareto"), `<div class="pareto">${html("ch-pareto")}</div>`)}${kart(document.getElementById("h-kopru").textContent, `<div class="fall">${html("ch-kopru")}</div>`)}</div>
    ${kart(t("h_tornado"), `<p class="csub">${t("s_tornado")}</p><div class="legend">${html("lg-tornado")}</div><div class="fall">${html("ch-tornado")}</div>`)}
    <div class="sayfa"></div>
    <h2>${t("r_para")}</h2>
    <p class="meta2">${t("r_buhar")}: <b>${fmt(buhar, 0)} GWh</b></p>
    <div class="grid save blok">${html("tasarruf")}</div>
    <div class="grid cols2">${kart(t("h_yilmaliyet"), `<div class="legend">${html("lg-yil")}</div>${html("ch-yil")}`)}${kart(t("h_ets"), `<p class="csub">${esc(document.getElementById("ets-not").textContent)}</p><div class="legend">${html("lg-ets")}</div>${html("ch-ets")}`)}</div>
    <h2>${t("r_kalem")}</h2><div class="wrap blok"><table>${html("kalemler")}</table></div>
    <h2>${t("r_kontrol")}</h2><div class="wrap blok"><table>${html("kontrol")}</table></div>
    <h2>${t("r_varsayim")}</h2><div class="wrap"><table class="ptable"><tr><th>${t("kalem")}</th><th class="n">${t("deger")}</th><th>${t("birimk")}</th><th>${t("tur")}</th><th>${t("kaynak")}</th></tr>${varsayim}</table></div>
    <h2>${t("r_sinir")}</h2><div class="note blok"><ul>${t("eksik").map(x => `<li>${x}</li>`).join("")}</ul></div>
    <p class="meta2" style="margin-top:14px">${t("dipnot")}</p>`;
}

function metinler() {
  document.documentElement.lang = dil;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  document.getElementById("dil").textContent = { tr: "EN", en: "FI", fi: "TR" }[dil];
  document.getElementById("eksik").innerHTML = `<ul>${t("eksik").map(x => `<li>${x}</li>`).join("")}</ul>`;
}
function hepsi() { metinler(); kazanKartlari(); odakListesi(); parametreler(); document.getElementById("detay").innerHTML = ""; document.getElementById("detay2").innerHTML = ""; secili = null; guncelle(); }

document.getElementById("dil").addEventListener("click", () => { dil = { tr: "en", en: "fi", fi: "tr" }[dil]; hepsi(); });
document.getElementById("pdf").addEventListener("click", () => {
  raporOlustur();
  const eski = document.title;
  document.title = ({ tr: "Donusum_raporu_", en: "Conversion_report_", fi: "Muunnosraportti_" }[dil]) + "Emine_Edis_" + new Date().toISOString().slice(0, 10);
  window.print();
  document.title = eski;
});
document.getElementById("sifirla").addEventListener("click", () => { P = kopya(VARSAYILAN); KZ = kopya(KAZANLAR); odak = 1; buhar = 795; hepsi(); });
document.getElementById("ekle").addEventListener("click", () => {
  const son = KZ[KZ.length - 1] || KAZANLAR[0];
  KZ.push(Object.assign(kopya(son), { ad: `${t("yeni")} ${KZ.length + 1}` }));
  kazanKartlari(); odakListesi(); guncelle();
});
document.getElementById("odak").addEventListener("change", e => { odak = +e.target.value; guncelle(); });
document.getElementById("buhar").addEventListener("input", e => { buhar = +e.target.value; guncelle(); });
document.querySelectorAll("#gorunum button").forEach(b => b.addEventListener("click", () => { gorunum = b.dataset.v; secili = null; document.getElementById("detay").innerHTML = ""; guncelle(); }));
hepsi();
if (location.hash === "#rapor") raporOlustur(); // doğrudan yazdırma ya da otomatik PDF üretimi için
</script>
</body>
</html>
